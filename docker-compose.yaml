version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c2_web
    restart: always
    ports:
      - "3000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-default-key-for-dev-only}
      DB_NAME: ${DB_NAME:-c2_db}
      DB_USER: ${DB_USER:-c2_admin}
      DB_PASSWORD: ${DB_PASSWORD:-c2_secure_pass_998}
      DB_HOST: "db"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "*"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      LUARMOR_DEV_KEY: ${LUARMOR_DEV_KEY}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: c2_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-c2_db}
      POSTGRES_USER: ${DB_USER:-c2_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-c2_secure_pass_998}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

volumes:
  postgres_data_v2:
