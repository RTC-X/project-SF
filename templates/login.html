{% extends 'base.html' %}

{% block title %}C2 | Login{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-panel p-10 rounded-3xl relative overflow-hidden shadow-2xl">
        
        <!-- Ambient Decorative Glows inside Login Box -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-teal-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-orange-500/10 rounded-full blur-2xl"></div>
        
        <div class="text-center relative z-10">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-tr from-orange-500 to-teal-400 flex items-center justify-center shadow-lg shadow-orange-500/10 mb-4">
                <i data-lucide="shield-check" class="w-6 h-6 text-white animate-pulse"></i>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
                Snowflake C2
            </h2>
            <p class="mt-2 text-sm text-zinc-400 font-sans">
                Authenticate securely to access your fleet operations
            </p>
        </div>

        {% if error %}
            <div class="bg-orange-500/10 border border-orange-500/20 text-orange-400 px-4 py-3 rounded-2xl text-sm font-mono flex items-center gap-2 relative z-10 animate-shake">
                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <div class="mt-8 relative z-10">
            {% load socialaccount %}
            <a href="{% provider_login_url 'discord' %}" 
               class="group relative w-full flex justify-center py-4 px-4 border border-indigo-500/30 text-base font-bold rounded-2xl text-white bg-indigo-600/30 hover:bg-indigo-600/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-300 hover:shadow-lg hover:shadow-indigo-500/25 hover:-translate-y-0.5 items-center gap-3">
                <span class="flex items-center">
                    <!-- Official Discord Brand SVG -->
                    <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors duration-300" fill="currentColor" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,69.43,69.43,0,0,1-10.5-5c.86-.63,1.72-1.3,2.54-2a73.57,73.57,0,0,0,75.9,0c.82.69,1.68,1.36,2.54,2a69.43,69.43,0,0,1-10.5,5A77.7,77.7,0,0,0,105.1,96.36a105.73,105.73,0,0,0,31-18.83C129,50.7,122.64,27.78,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
                    </svg>
                </span>
                Login with Discord
            </a>
        </div>
    </div>
</div>
{% endblock %}
