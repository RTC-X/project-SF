{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Next-Gen Premium C2 (Command & Control) Dashboard to remotely manage, configure, and monitor your Roblox accounts in real-time.">
    
    <!-- Discord & Open Graph Embed Design -->
    <meta name="theme-color" content="#14b8a6">
    <meta property="og:type" content="website">
    <meta property="og:title" content="C2 | Remote Roblox Account Controller">
    <meta property="og:description" content="A premium, real-time command center to easily manage, configure, and monitor your Roblox accounts remotely.">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'c2_logo.png' %}">
    
    <!-- Twitter Embed Card Design -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="C2 | Remote Roblox Account Controller">
    <meta name="twitter:description" content="A premium, real-time command center to easily manage, configure, and monitor your Roblox accounts remotely.">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'c2_logo.png' %}">

    <title>{% block title %}C2{% endblock %}</title>
    <!-- Dynamic Glowing SVG Favicon matching the C2 Terminal Brand Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23f97316'/%3E%3Cstop offset='100%25' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 20l5-5-5-5M16 21h7' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <!-- Outfit & Fira Code Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Alpine.js & Tailwind CSS Play CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #06060a;
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(20, 184, 166, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 10% 90%, rgba(249, 115, 22, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(9, 9, 11, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Custom scrollbar styling for premium dark theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(20, 184, 166, 0.18); /* Premium translucent teal */
            border: 1px solid rgba(20, 184, 166, 0.08);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(20, 184, 166, 0.45); /* High-fidelity glowing teal hover */
            border-color: rgba(20, 184, 166, 0.25);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full font-sans text-zinc-100 flex flex-col antialiased">

    <!-- Top Glow Header Navbar -->
    <header aria-label="C2 Navigation Header" class="w-full py-4 px-6 glass-panel border-b border-white/5 sticky top-0 z-40 flex items-center justify-between">
        <a href="javascript:void(0)" onclick="window.location.reload();" class="flex items-center gap-3 group cursor-pointer select-none transition-all duration-200 active:scale-95">
            <div class="h-10 w-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-teal-400 flex items-center justify-center shadow-lg shadow-orange-500/10 group-hover:shadow-orange-500/30 group-hover:scale-105 transition-all duration-300">
                <i data-lucide="terminal" class="w-5 h-5 text-white transition-transform group-hover:rotate-6 duration-300"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide uppercase bg-gradient-to-r from-teal-400 to-orange-400 bg-clip-text text-transparent transition-all duration-300 group-hover:brightness-125">
                    C2
                </h1>
                <p class="text-[10px] text-zinc-500 font-mono tracking-widest uppercase transition-colors duration-300 group-hover:text-zinc-400">C2 Controller</p>
            </div>
        </a>
        
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <div class="flex items-center gap-3 px-3 py-1.5 rounded-2xl bg-white/5 border border-white/5">
                    <div class="h-7 w-7 rounded-xl bg-teal-500/20 border border-teal-500/30 flex items-center justify-center">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-teal-400"></i>
                    </div>
                    <span class="text-sm font-medium text-zinc-300 font-mono">{{ user.username }}</span>
                </div>
                
                <a href="{% url 'logout' %}" class="flex items-center gap-2 text-sm text-zinc-400 hover:text-orange-400 transition-all font-medium py-2 px-4 rounded-2xl hover:bg-orange-500/10 border border-transparent hover:border-orange-500/20">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Log Out</span>
                </a>
            {% else %}
                <div class="text-xs text-zinc-500 font-mono flex items-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-orange-500/50 animate-pulse"></span>
                    SECURE DOCK PANEL
                </div>
            {% endif %}
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 flex flex-col justify-start">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full py-4 text-center border-t border-white/5 mt-auto">
        <span class="text-xs font-mono text-zinc-600">C2 Automation Framework &copy; 2026. Made with Precision.</span>
    </footer>

    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
