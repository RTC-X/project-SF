{% extends 'base.html' %}

{% block title %}C2 | Dashboard{% endblock %}

{% block content %}
<div class="space-y-8" x-data="{ 
    selectedBot: null,
    showConfigModal: false,
    activeTab: 'telemetry',
    bots: [],
    logs: [],
    ws: null,
    enchant1: '',
    enchant2: '',
    enchant3: '',
    newUuid: '',
    
    init() {
        this.connectWS();
    },
    
    connectWS() {
        const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
        this.ws = new WebSocket(`${wsScheme}://${window.location.host}/ws/c2/`);
        
        this.ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'fleet_update') {
                this.bots = data.bots;
            } else if (data.type === 'new_log') {
                this.logs.unshift(data.log);
                if (this.logs.length > 50) this.logs.pop();
            }
        };
        
        this.ws.onclose = () => {
            console.log('WS connection lost, retrying in 3 seconds...');
            setTimeout(() => this.connectWS(), 3000);
        };
    },
    
    sendCommand(botId, action, payload = {}) {
        this.ws.send(JSON.stringify({
            action: 'command',
            target_id: botId,
            command: action,
            payload: payload
        }));
    },
    
    formatTime(seconds) {
        if (!seconds) return '00:00:00';
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }
}">

    <!-- Top Dashboard Statistics Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute right-4 top-4 text-teal-400/20">
                <i data-lucide="cpu" class="w-8 h-8"></i>
            </div>
            <p class="text-xs font-mono text-zinc-500 uppercase tracking-wider">Active Fleet Size</p>
            <p class="text-3xl font-extrabold text-white mt-2 font-mono" x-text="bots.filter(b => b.status !== 'Offline').length + '/' + bots.length">0/0</p>
        </div>
        <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute right-4 top-4 text-orange-400/20">
                <i data-lucide="swords" class="w-8 h-8"></i>
            </div>
            <p class="text-xs font-mono text-zinc-500 uppercase tracking-wider">Farming Target Nodes</p>
            <p class="text-3xl font-extrabold text-white mt-2 font-mono" x-text="bots.filter(b => b.status === 'Farming').length">0</p>
        </div>
        <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute right-4 top-4 text-teal-400/20">
                <i data-lucide="dollar-sign" class="w-8 h-8"></i>
            </div>
            <p class="text-xs font-mono text-zinc-500 uppercase tracking-wider">Total Accumulated Wealth</p>
            <p class="text-3xl font-extrabold text-emerald-400 mt-2 font-mono">$<span x-text="bots.reduce((acc, b) => acc + parseFloat(b.money), 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})">0.00</span></p>
        </div>
        <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute right-4 top-4 text-orange-400/20">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <p class="text-xs font-mono text-zinc-500 uppercase tracking-wider">Secured Tokens</p>
            <p class="text-3xl font-extrabold text-teal-400 mt-2 font-mono">ACTIVE</p>
        </div>
    </div>

    <!-- Layout Columns: Telemetry Grid & Activity Feed -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Live Telemetry Area -->
        <div class="lg:col-span-2 space-y-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="h-8 w-8 rounded-xl bg-teal-500/10 border border-teal-500/20 flex items-center justify-center">
                        <i data-lucide="network" class="w-4 h-4 text-teal-400"></i>
                    </div>
                    <h3 class="text-xl font-bold tracking-tight text-white">Live Node Telemetry</h3>
                </div>
                
                <!-- Quick Token Provision Button -->
                <button @click="selectedBot = null; showConfigModal = true" class="flex items-center gap-1.5 text-xs font-semibold font-mono text-teal-400 hover:text-white py-2 px-4 rounded-2xl bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/20 hover:border-teal-500/30 transition-all">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                    Provision Bot
                </button>
            </div>
            
            <!-- Dynamic Fleet Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <template x-for="bot in bots" :key="bot.id">
                    <div class="glass-panel p-6 rounded-3xl flex flex-col justify-between border border-white/5 hover:border-white/10 transition-all duration-300 relative group overflow-hidden">
                        
                        <!-- Status indicator strip -->
                        <div class="absolute left-0 top-0 bottom-0 w-1.5"
                            :class="{
                                'bg-emerald-400': bot.status === 'Farming',
                                'bg-teal-400': bot.status === 'Sniping',
                                'bg-amber-400': bot.status === 'Idle',
                                'bg-red-400': bot.status === 'Dead',
                                'bg-zinc-700': bot.status === 'Offline'
                            }">
                        </div>

                        <!-- Top Info -->
                        <div class="space-y-4">
                            <div class="flex items-center justify-between pl-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-md font-bold text-white font-mono" x-text="bot.username">Node</span>
                                    <span class="text-[9px] font-mono font-semibold px-2 py-0.5 rounded-full border"
                                        :class="{
                                            'bg-emerald-500/10 border-emerald-500/20 text-emerald-400': bot.status === 'Farming',
                                            'bg-teal-500/10 border-teal-500/20 text-teal-400': bot.status === 'Sniping',
                                            'bg-amber-500/10 border-amber-500/20 text-amber-400': bot.status === 'Idle',
                                            'bg-red-500/10 border-red-500/20 text-red-400': bot.status === 'Dead',
                                            'bg-zinc-500/10 border-zinc-500/20 text-zinc-400': bot.status === 'Offline'
                                        }"
                                        x-text="bot.status">OFFLINE</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <!-- Dynamic Action Button if Online -->
                                    <button x-show="bot.status !== 'Offline'" @click="selectedBot = bot; showConfigModal = true" class="h-8 w-8 rounded-xl bg-white/5 border border-white/5 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/10 transition-all">
                                        <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Telemetry Data points -->
                            <div class="grid grid-cols-2 gap-4 pl-2 font-mono text-xs">
                                <div>
                                    <span class="text-zinc-500 block text-[10px] uppercase">Node Level</span>
                                    <span class="text-zinc-300 font-semibold" x-text="'Lvl ' + bot.level">Lvl 0</span>
                                </div>
                                <div>
                                    <span class="text-zinc-500 block text-[10px] uppercase">Accumulated</span>
                                    <span class="text-emerald-400 font-semibold" x-text="'$' + parseFloat(bot.money).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})">$0.00</span>
                                </div>
                                <div>
                                    <span class="text-zinc-500 block text-[10px] uppercase">Uptime</span>
                                    <span class="text-zinc-300 font-semibold" x-text="formatTime(bot.session_time)">00:00:00</span>
                                </div>
                                <div>
                                    <span class="text-zinc-500 block text-[10px] uppercase">Active Areas</span>
                                    <span class="text-teal-400 font-semibold" x-text="bot.config?.active_areas.join(', ') || 'None'">None</span>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Commands -->
                        <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-end gap-2 pl-2">
                            <template x-if="bot.status !== 'Offline'">
                                <div class="flex items-center gap-2 w-full justify-between">
                                    <button @click="selectedBot = bot; showConfigModal = true" 
                                        class="flex-1 flex items-center justify-center gap-1.5 text-xs font-semibold py-2 px-3 rounded-xl transition-all font-mono bg-teal-500/10 border border-teal-500/20 text-teal-400 hover:bg-teal-500/20">
                                        <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
                                        <span>Manage</span>
                                    </button>
                                </div>
                            </template>
                            <template x-if="bot.status === 'Offline'">
                                <div class="w-full text-center text-[10px] text-zinc-600 font-mono py-1 uppercase tracking-wider">
                                    Await Node Connection
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Right Side Real-time logs panel -->
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="h-8 w-8 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center">
                        <i data-lucide="activity" class="w-4 h-4 text-orange-400"></i>
                    </div>
                    <h3 class="text-xl font-bold tracking-tight text-white">System Feed</h3>
                </div>
            </div>
            
            <div class="glass-panel p-6 rounded-3xl h-[480px] overflow-y-auto space-y-4 font-mono text-xs">
                <template x-if="logs.length === 0">
                    <div class="h-full flex flex-col items-center justify-center text-zinc-600 uppercase tracking-widest text-[10px] py-32">
                        <i data-lucide="terminal" class="w-8 h-8 text-zinc-700 mb-2"></i>
                        Feed Quiet
                    </div>
                </template>
                <template x-for="log in logs" :key="log.id">
                    <div class="border-b border-white/5 pb-2.5 space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-teal-400 font-semibold" x-text="log.username">RoboFarmer</span>
                            <span class="text-[10px] text-zinc-500" x-text="log.time">10:52:12</span>
                        </div>
                        <p class="text-zinc-400" x-text="log.message">Dispatched node to Area 12 successfully.</p>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Bespoke Modals (Alpine Dynamic Forms) -->
    <div class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/80 backdrop-blur-md"
        x-show="showConfigModal" 
        x-transition
        style="display: none;">
        
        <!-- Config Modal Container -->
        <div class="glass-panel w-full max-w-6xl p-6 rounded-3xl relative overflow-hidden bg-zinc-950 border border-white/5 shadow-2xl" @click.away="showConfigModal = false">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
                <h4 class="text-lg font-bold text-white font-mono" x-text="selectedBot ? 'Manage Fleet Bot: ' + selectedBot.username : 'Provision New Bot Token'">Manage Fleet Bot</h4>
                <button @click="showConfigModal = false" class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- If provisioning new bot -->
            <template x-if="!selectedBot">
                <div class="space-y-4 max-w-md mx-auto py-8">
                    <div>
                        <label class="block text-xs font-mono text-zinc-400 uppercase tracking-wider mb-2">Roblox Bot Username</label>
                        <input type="text" class="w-full bg-zinc-950/60 border border-white/5 rounded-2xl py-3 px-4 text-sm text-white font-mono focus:outline-none focus:ring-1 focus:ring-teal-400" placeholder="e.g. RoboFarmer_Alpha">
                    </div>
                    <button class="w-full py-3 text-sm font-bold bg-teal-500/10 border border-teal-500/20 text-white rounded-2xl hover:bg-teal-500/20 transition-all font-mono">
                        Generate C2 Credentials
                    </button>
                </div>
            </template>

            <!-- If managing live bot (matching game-monitoring console mockup exactly) -->
            <template x-if="selectedBot">
                <div class="space-y-6">
                    
                    <!-- Premium Header Sub-Bar -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-2xl bg-zinc-900/40 border border-white/5">
                        <div class="flex items-center gap-3.5">
                            <!-- Premium squircle avatar gradient icon -->
                            <div class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-orange-500 to-teal-400 flex items-center justify-center shadow-lg shadow-orange-500/10 shrink-0">
                                <i data-lucide="bot" class="w-6 h-6 text-white animate-pulse"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xl font-bold tracking-tight text-white font-mono" x-text="selectedBot.username">ChongXiNa6</span>
                                    <!-- Status Badge -->
                                    <span class="text-[9px] font-mono font-semibold px-2.5 py-0.5 rounded-full border bg-amber-500/10 border-amber-500/20 text-amber-400"
                                          :class="{'bg-emerald-500/10 border-emerald-500/20 text-emerald-400': selectedBot.status === 'Farming', 'bg-teal-500/10 border-teal-500/20 text-teal-400': selectedBot.status === 'Sniping'}"
                                          x-text="selectedBot.status">Idle</span>
                                    
                                    <!-- Sniper Badge -->
                                    <span class="text-[9px] font-mono font-semibold px-2.5 py-0.5 rounded-full border"
                                          :class="selectedBot.config?.snipe_enabled ? 'bg-teal-500/10 border-teal-500/20 text-teal-400' : 'bg-zinc-800 border-zinc-700 text-zinc-500'"
                                          x-text="selectedBot.config?.snipe_enabled ? 'Sniper Active' : 'Sniper Inactive'">Sniper Active</span>
                                </div>
                                <div class="flex items-center gap-4 mt-1.5 text-xs text-zinc-500 font-mono">
                                    <span class="text-teal-400">• <span class="text-zinc-400" x-text="selectedBot.status">Idle</span></span>
                                    <span>⏱ <span class="text-zinc-300" x-text="formatTime(selectedBot.session_time)">04:07:24</span></span>
                                    <span>⭐ <span class="text-zinc-300">+0 Lvls</span></span>
                                    <span>💰 <span class="text-zinc-300">+0 Cash</span></span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Control Action Buttons Row -->
                        <div class="flex items-center flex-wrap gap-2.5">
                            <label class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-zinc-900 border border-white/5 hover:border-white/10 transition-all cursor-pointer select-none">
                                <input type="checkbox" :checked="selectedBot.status !== 'Offline'" class="rounded border-zinc-700 bg-zinc-800 text-teal-500 focus:ring-teal-500/30">
                                <span class="text-xs text-zinc-300 font-medium font-mono">Activate</span>
                            </label>
                            
                            <button @click="selectedBot.config.farm_enabled = !selectedBot.config.farm_enabled; sendCommand(selectedBot.id, 'syncConfig', selectedBot.config)" 
                                    class="px-4 py-1.5 bg-zinc-900 border text-xs font-semibold rounded-xl transition-all font-mono"
                                    :class="selectedBot.config.farm_enabled ? 'border-teal-500/30 text-teal-400 hover:bg-teal-500/10' : 'border-white/5 text-zinc-300 hover:bg-zinc-800'">
                                Toggle Farm
                            </button>
                            
                            <button @click="selectedBot.config.snipe_enabled = !selectedBot.config.snipe_enabled; sendCommand(selectedBot.id, 'syncConfig', selectedBot.config)" 
                                    class="px-4 py-1.5 bg-zinc-900 border text-xs font-semibold rounded-xl transition-all font-mono"
                                    :class="selectedBot.config.snipe_enabled ? 'border-orange-500/30 text-orange-400 hover:bg-orange-500/10' : 'border-white/5 text-zinc-300 hover:bg-zinc-800'">
                                Toggle Sniper
                            </button>
                            
                            <button @click="sendCommand(selectedBot.id, 'teleportHome')" class="px-4 py-1.5 bg-zinc-900 border border-white/5 text-xs text-zinc-300 font-semibold rounded-xl hover:bg-zinc-800 transition-all font-mono flex items-center gap-1">
                                🏡 Home
                            </button>
                            
                            <button @click="sendCommand(selectedBot.id, 'toggle3D')" class="px-4 py-1.5 bg-zinc-900 border border-white/5 text-xs text-zinc-300 font-semibold rounded-xl hover:bg-zinc-800 transition-all font-mono">
                                Toggle 3D
                            </button>
                            
                            <button class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs rounded-xl transition-all font-mono flex items-center gap-1.5 shadow-lg shadow-amber-500/10">
                                ⚙️ Options
                            </button>
                        </div>
                    </div>

                    <!-- 3-Column Layout Grid matching mockup exactly -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        <!-- COLUMN 1: 🌟 Ascender Stats -->
                        <div class="glass-panel p-5 rounded-2xl border border-white/5 space-y-4">
                            <div class="flex items-center gap-2 pb-2.5 border-b border-white/5">
                                <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                                <h5 class="text-sm font-bold text-white font-mono tracking-wide uppercase">Ascender</h5>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <!-- Level Card -->
                                <div class="bg-zinc-950/60 border border-white/5 rounded-xl p-3">
                                    <span class="block text-[9px] font-mono text-zinc-500 uppercase tracking-widest">LEVEL</span>
                                    <span class="block text-lg font-bold text-white mt-1" x-text="selectedBot.level">490</span>
                                </div>
                                <!-- Class Card -->
                                <div class="bg-zinc-950/60 border border-white/5 rounded-xl p-3">
                                    <span class="block text-[9px] font-mono text-zinc-500 uppercase tracking-widest">CLASS</span>
                                    <span class="block text-xs font-bold text-white mt-1.5 truncate" x-text="selectedBot.bot_class">Unbeatable</span>
                                </div>
                                <!-- Quality Card -->
                                <div class="bg-zinc-950/60 border border-white/5 rounded-xl p-3 col-span-2">
                                    <span class="block text-[9px] font-mono text-zinc-500 uppercase tracking-widest">QUALITY</span>
                                    <span class="block text-sm font-bold text-white mt-1" x-text="selectedBot.quality">Spectacular</span>
                                </div>
                                <!-- Rarity Card -->
                                <div class="bg-zinc-950/60 border border-white/5 rounded-xl p-3">
                                    <span class="block text-[9px] font-mono text-zinc-500 uppercase tracking-widest">RARITY</span>
                                    <span class="block text-xs font-bold text-white mt-1.5" x-text="selectedBot.rarity">Heavenly++</span>
                                </div>
                                <!-- Mold Card -->
                                <div class="bg-zinc-950/60 border border-white/5 rounded-xl p-3">
                                    <span class="block text-[9px] font-mono text-zinc-500 uppercase tracking-widest">MOLD</span>
                                    <span class="block text-xs font-bold text-white mt-1.5" x-text="selectedBot.mold">Crystal</span>
                                </div>
                            </div>
                            
                            <!-- Substats indicators list -->
                            <div class="space-y-1.5 pt-2 border-t border-white/5 font-mono text-xs">
                                <div class="text-zinc-400">1: Fortune (Lvl 25)</div>
                                <div class="text-zinc-400">2: Fortune (Lvl 24)</div>
                                <div class="text-zinc-400">3: Ancient (Lvl 19)</div>
                                <div class="text-zinc-300 font-bold mt-2">Mode: <span class="text-amber-400">Rarity</span></div>
                            </div>
                            
                            <!-- Target Filter Selector Buttons -->
                            <div class="grid grid-cols-3 gap-1.5 pt-2">
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Quality</button>
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Rarity</button>
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Mold</button>
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Class</button>
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Enchant</button>
                                <button class="py-1 px-1.5 bg-zinc-900 border border-white/5 text-[9px] font-semibold font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-all text-center">Level</button>
                            </div>
                        </div>

                        <!-- COLUMN 2: 📋 Snipe Config -->
                        <div class="glass-panel p-5 rounded-2xl border border-white/5 space-y-5">
                            <div class="flex items-center gap-2 pb-2.5 border-b border-white/5">
                                <i data-lucide="scroll" class="w-4 h-4 text-teal-400"></i>
                                <h5 class="text-sm font-bold text-white font-mono tracking-wide uppercase">Snipe Config</h5>
                            </div>
                            
                            <!-- Wishlist Target Sets Section -->
                            <div class="space-y-2.5">
                                <span class="block text-[10px] font-bold text-teal-400 font-mono tracking-wider uppercase">Target Sets</span>
                                
                                <div class="space-y-1.5 max-h-[85px] overflow-y-auto">
                                    <template x-if="!selectedBot.config?.target_enchant_sets || selectedBot.config.target_enchant_sets.length === 0">
                                        <div class="text-[10px] text-zinc-500 font-mono italic">No enchant sets in sniper wishlist.</div>
                                    </template>
                                    <template x-for="(set, idx) in selectedBot.config?.target_enchant_sets || []" :key="idx">
                                        <div class="flex items-center justify-between p-2 rounded-xl bg-zinc-950/60 border border-white/5">
                                            <span class="text-[10px] text-zinc-300 font-mono font-semibold" x-text="set">Ancient + Fortune</span>
                                            <button @click="selectedBot.config.target_enchant_sets.splice(idx, 1); sendCommand(selectedBot.id, 'syncConfig', selectedBot.config)" 
                                                    class="text-[8px] bg-red-500/20 text-red-400 border border-red-500/30 px-1.5 py-0.5 rounded-md font-mono hover:bg-red-500/30 transition-all">Rem</button>
                                        </div>
                                    </template>
                                </div>
                                
                                <!-- Multi-Enchant Builder Box -->
                                <div class="space-y-1.5 pt-1">
                                    <div class="grid grid-cols-3 gap-1.5">
                                        <input type="text" x-model="enchant1" placeholder="Enchant 1" class="bg-zinc-950/60 border border-white/5 text-[10px] rounded-lg px-2 py-1.5 text-white font-mono focus:outline-none focus:ring-1 focus:ring-teal-400">
                                        <input type="text" x-model="enchant2" placeholder="Enchant 2" class="bg-zinc-950/60 border border-white/5 text-[10px] rounded-lg px-2 py-1.5 text-white font-mono focus:outline-none focus:ring-1 focus:ring-teal-400">
                                        <input type="text" x-model="enchant3" placeholder="Enchant 3" class="bg-zinc-950/60 border border-white/5 text-[10px] rounded-lg px-2 py-1.5 text-white font-mono focus:outline-none focus:ring-1 focus:ring-teal-400">
                                    </div>
                                    
                                    <button @click="
                                        let combined = [];
                                        if (enchant1) combined.push(enchant1);
                                        if (enchant2) combined.push(enchant2);
                                        if (enchant3) combined.push(enchant3);
                                        if (combined.length > 0) {
                                            if (!selectedBot.config.target_enchant_sets) selectedBot.config.target_enchant_sets = [];
                                            selectedBot.config.target_enchant_sets.push(combined.join(' + '));
                                            enchant1 = ''; enchant2 = ''; enchant3 = '';
                                            sendCommand(selectedBot.id, 'syncConfig', selectedBot.config);
                                        }
                                    " class="w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-black text-[10px] font-bold rounded-xl transition-all font-mono uppercase tracking-wider">
                                        Add Target Set
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Whitelisted/Protected UUIDs Section -->
                            <div class="space-y-2 pt-2 border-t border-white/5">
                                <span class="block text-[10px] font-bold text-teal-400 font-mono tracking-wider uppercase">Protected UUIDs</span>
                                
                                <div class="max-h-[60px] overflow-y-auto space-y-1.5">
                                    <template x-if="!selectedBot.config?.whitelisted_uuids || selectedBot.config.whitelisted_uuids.length === 0">
                                        <div class="text-[10px] text-zinc-500 font-mono italic">Whitelist is empty</div>
                                    </template>
                                    <template x-for="(uuid, idx) in selectedBot.config?.whitelisted_uuids || []" :key="idx">
                                        <div class="flex items-center justify-between p-1.5 rounded-lg bg-zinc-950/60 border border-white/5">
                                            <span class="text-[10px] text-zinc-400 font-mono truncate mr-2" x-text="uuid">Sword_1</span>
                                            <button @click="selectedBot.config.whitelisted_uuids.splice(idx, 1); sendCommand(selectedBot.id, 'syncConfig', selectedBot.config)" 
                                                    class="text-[8px] bg-red-500/20 text-red-400 border border-red-500/30 px-1 py-0.5 rounded font-mono hover:bg-red-500/30 transition-all">Rem</button>
                                        </div>
                                    </template>
                                </div>
                                
                                <div class="flex items-center gap-1.5 pt-1">
                                    <select x-model="newUuid" class="flex-1 bg-zinc-950/60 border border-white/5 text-[10px] rounded-lg px-2 py-1.5 text-zinc-400 font-mono focus:outline-none focus:ring-1 focus:ring-teal-400">
                                        <option value="">Backpack empty...</option>
                                        <template x-for="item in selectedBot.backpack_items || []">
                                            <option :value="item.uuid" x-text="item.name"></option>
                                        </template>
                                    </select>
                                    <button @click="
                                        if (newUuid) {
                                            if (!selectedBot.config.whitelisted_uuids) selectedBot.config.whitelisted_uuids = [];
                                            selectedBot.config.whitelisted_uuids.push(newUuid);
                                            newUuid = '';
                                            sendCommand(selectedBot.id, 'syncConfig', selectedBot.config);
                                        }
                                    " class="px-3 py-1.5 bg-zinc-900 border border-white/5 text-[10px] font-bold text-white rounded-lg hover:bg-zinc-800 transition-all font-mono">
                                        Add
                                    </button>
                                </div>
                                
                                <span class="block text-[9px] text-amber-500/80 font-mono leading-tight mt-1">*Tip: Whitelisting protects items from being dropped/sold!</span>
                            </div>
                        </div>

                        <!-- COLUMN 3: 🎒 Backpack Items -->
                        <div class="glass-panel p-5 rounded-2xl border border-white/5 flex flex-col justify-between h-full">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between pb-2.5 border-b border-white/5">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="shopping-bag" class="w-4 h-4 text-orange-400"></i>
                                        <h5 class="text-sm font-bold text-white font-mono tracking-wide uppercase">Backpack</h5>
                                    </div>
                                    <span class="text-[9px] font-mono font-semibold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-white/5" x-text="(selectedBot.backpack_items?.length || 0) + ' Items'">0 Items</span>
                                </div>
                                
                                <!-- Backpack items scroller -->
                                <div class="space-y-2 max-h-[300px] overflow-y-auto">
                                    <template x-if="!selectedBot.backpack_items || selectedBot.backpack_items.length === 0">
                                        <div class="text-zinc-500 font-mono text-xs text-center py-20 italic">Backpack empty</div>
                                    </template>
                                    
                                    <template x-for="item in selectedBot.backpack_items || []" :key="item.uuid">
                                        <div class="p-3 rounded-xl bg-zinc-950/60 border border-white/5 flex items-center justify-between gap-2 hover:border-orange-500/20 transition-all select-none">
                                            <div class="space-y-0.5">
                                                <span class="block text-xs font-bold text-white font-mono" x-text="item.name">Ancient Broadsword</span>
                                                <span class="block text-[9px] font-mono text-zinc-500" x-text="item.traits.join(', ')">Ancient II, Level 10</span>
                                            </div>
                                            <!-- Action options if wanted -->
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}
